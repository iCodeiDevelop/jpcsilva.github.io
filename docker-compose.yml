version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: portfolio_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-secret}
      MONGO_INITDB_DATABASE: portfolio_db
    volumes:
      - mongo_data:/data/db
    networks: [portfolio_net]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    networks: [portfolio_net]
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          5000
      MONGODB_URI:   mongodb://admin:secret@mongo:27017/portfolio_db?authSource=admin
      REDIS_URL:     redis://:redispass@redis:6379
      JWT_SECRET:    ${JWT_SECRET:-changeme_32chars_minimum_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_32chars_refresh_secret}
      JWT_EXPIRES_IN:     15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL:    ${CLIENT_URL:-http://localhost:3000}
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASS:     ${SMTP_PASS:-}
      EMAIL_FROM:    ${EMAIL_FROM:-}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
      ADMIN_EMAIL:   ${ADMIN_EMAIL:-admin@portfolio.dev}
      ADMIN_PASSWORD:${ADMIN_PASSWORD:-Admin@123!}
      ADMIN_NAME:    ${ADMIN_NAME:-Portfolio Admin}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      mongo:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    networks: [portfolio_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: portfolio_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:  http://backend:5000/api
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on: [backend]
    networks: [portfolio_net]

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
    networks: [portfolio_net]

volumes:
  mongo_data:
  redis_data:
  uploads:
  logs:

networks:
  portfolio_net:
    driver: bridge
